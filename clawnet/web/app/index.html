<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f1419">
  <meta name="description" content="This phone as a node of your ClawNet network: end-to-end encrypted messages through a computer on the same Wi-Fi.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClawNet">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="no-referrer">
  <title>ClawNet</title>
  <link rel="manifest" href="/web/app/manifest.webmanifest">
  <link rel="icon" href="/web/app/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/web/app/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/web/app/app.css">
  <script type="module" src="/web/app/main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="bar" id="bar">
      <span class="wordmark">ClawNet</span>
    </header>
    <main class="page" id="page" tabindex="-1">
      <p class="muted" id="boot-text">Starting…</p>
      <noscript><p>ClawNet runs in your browser and needs JavaScript switched on.</p></noscript>
    </main>
  </div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>
</body>
</html>
